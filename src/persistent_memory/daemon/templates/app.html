<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>persistent-memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="/static/pm/logo.png" />
<link rel="stylesheet" href="/static/pm/styles.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0d14; overflow: hidden; }
  #root, .pm-app { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.PM = {{ pm_json | safe }};
  window.PM.byId = Object.fromEntries(window.PM.all.map(function (r) { return [r.id, r]; }));
  window.PM.decisions = window.PM.all.filter(function (r) { return r.kind === "decision"; });
  window.PM.lessons = window.PM.all.filter(function (r) { return r.kind === "lesson"; });
  window.PM_TOKEN = "{{ pm_token }}";
  window.PM_I18N = {{ pm_i18n_json | safe }};
  window.t = function(k, fallback) { return (window.PM_I18N && window.PM_I18N[k]) || fallback || k; };
  window.PM_API = {
    statusEndpoint: { accepted: "accept", reverted: "reject" },
    setStatus: function (id, uiStatus) {
      var action = this.statusEndpoint[uiStatus];
      if (!action) return Promise.resolve(false);
      return fetch("/api/records/" + encodeURIComponent(id) + "/" + action, {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) { return r.ok; }).catch(function () { return false; });
    },
    fetchSource: function (id) {
      return fetch("/api/records/" + encodeURIComponent(id) + "/source")
        .then(function (r) { return r.ok ? r.json() : { passages: [] }; })
        .catch(function () { return { passages: [] }; });
    },
    fetchRaw: function (id) {
      return fetch("/api/records/" + encodeURIComponent(id) + "/raw")
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    },
    fetchRecordSections: function (id) {
      return fetch("/api/records/" + encodeURIComponent(id) + "/sections")
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    },
    saveBody: function (id, body) {
      return fetch("/api/records/" + encodeURIComponent(id) + "/body", {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify({ body: body }),
      }).then(function (r) { return { ok: r.ok, status: r.status }; })
        .catch(function () { return { ok: false, status: 0 }; });
    },
    fetchAgentAssets: function () {
      return fetch("/api/agent-assets", {
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) { return r.json(); });
    },
    fetchAgentAssetRaw: function (id) {
      return fetch("/api/agent-assets/" + encodeURIComponent(id) + "/raw", {
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) { return r.ok ? r.json() : null; });
    },
    saveAgentAsset: function (id, content) {
      return fetch("/api/agent-assets/" + encodeURIComponent(id), {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-PM-Token": window.PM_TOKEN },
        body: JSON.stringify({ content: content }),
      }).then(function (r) { return { ok: r.ok, status: r.status }; });
    },
    fetchSupersessionCandidates: function () {
      return fetch("/api/supersession-candidates")
        .then(function (r) { return r.ok ? r.json() : { candidates: [] }; })
        .catch(function () { return { candidates: [] }; });
    },
    dismissCandidate: function (payload) {
      return fetch("/api/supersession-candidates/dismiss", {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (r) { return r.ok; }).catch(function () { return false; });
    },
    linkSupersession: function (oldId, newId) {
      return fetch("/api/records/" + encodeURIComponent(oldId) + "/supersede-by/" + encodeURIComponent(newId), {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) { return { ok: r.ok, status: r.status }; })
        .catch(function () { return { ok: false, status: 0 }; });
    },
    fetchCouncilBoard: function (project, thread, since, limit) {
      var params = new URLSearchParams();
      params.set("project", project);
      if (thread) params.set("thread", thread);
      if (since) params.set("since", since);
      if (limit) params.set("limit", String(limit));
      return fetch("/api/council/board?" + params.toString())
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (body) {
            return { ok: r.ok, status: r.status, project: body.project, thread: body.thread, messages: body.messages || [] };
          });
        })
        .catch(function () { return { ok: false, status: 0, messages: [] }; });
    },
    fetchCouncilThreads: function (project) {
      return fetch("/api/council/threads?" + new URLSearchParams({ project: project }).toString())
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (body) {
            return { ok: r.ok, status: r.status, threads: body.threads || [] };
          });
        })
        .catch(function () { return { ok: false, status: 0, threads: [] }; });
    },
    postCouncilBoard: function (payload) {
      return fetch("/api/council/board", {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (r) {
        if (r.ok) return { ok: true, status: r.status };
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: false, status: r.status, detail: body && body.detail };
        });
      }).catch(function () { return { ok: false, status: 0 }; });
    },
    fetchCouncilSessions: function (project, limit) {
      var params = new URLSearchParams({ project: project });
      if (limit) params.set("limit", String(limit));
      return fetch("/api/council/sessions?" + params.toString())
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (body) {
            return { ok: r.ok, status: r.status, sessions: body.sessions || [] };
          });
        })
        .catch(function () { return { ok: false, status: 0, sessions: [] }; });
    },
    fetchCouncilSession: function (project, sessionId) {
      var params = new URLSearchParams({ project: project });
      return fetch("/api/council/sessions/" + encodeURIComponent(sessionId) + "?" + params.toString())
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (body) {
            return { ok: r.ok, status: r.status, session: body };
          });
        })
        .catch(function () { return { ok: false, status: 0, session: null }; });
    },
    postCouncilSession: function (payload) {
      return fetch("/api/council/sessions", {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, status: r.status, body: body, detail: body && body.detail };
        });
      }).catch(function () { return { ok: false, status: 0, body: {} }; });
    },
    cancelCouncilSession: function (project, sessionId) {
      var params = new URLSearchParams({ project: project });
      return fetch("/api/council/sessions/" + encodeURIComponent(sessionId) + "/cancel?" + params.toString(), {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, status: r.status, body: body, detail: body && body.detail };
        });
      }).catch(function () { return { ok: false, status: 0, body: {} }; });
    },
    fetchCouncilPrompt: function () {
      return fetch("/api/council/prompt")
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (body) {
            return {
              ok: r.ok, status: r.status,
              text: body.text, is_default: body.is_default, default_text: body.default_text,
              version: body.version,
              detail: body && body.detail,
            };
          });
        })
        .catch(function () { return { ok: false, status: 0 }; });
    },
    saveCouncilPrompt: function (text, version) {
      var payload = { text: text };
      if (version !== undefined && version !== null) payload.version = version;
      return fetch("/api/council/prompt", {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, status: r.status, version: body.version, detail: body && body.detail };
        });
      }).catch(function () { return { ok: false, status: 0 }; });
    },
    resetCouncilPrompt: function () {
      return fetch("/api/council/prompt/reset", {
        method: "POST",
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, status: r.status, detail: body && body.detail };
        });
      }).catch(function () { return { ok: false, status: 0 }; });
    },
    fetchCouncilConfig: function (project, cwd) {
      var params = new URLSearchParams({ project: project, cwd: cwd });
      return fetch("/api/council/config?" + params.toString(), {
        headers: { "X-PM-Token": window.PM_TOKEN },
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return {
            ok: r.ok, status: r.status,
            config: body.config, prompt_layers: body.prompt_layers, source: body.source,
            detail: body && body.detail,
          };
        });
      }).catch(function () { return { ok: false, status: 0 }; });
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="/static/pm/tweaks-panel.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/components.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/markdown.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-detail.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-list.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-dashboard.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-projects.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-graph.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-misc.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-candidates.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-council-scene.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-council.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-council-prompt.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/views-agents.jsx?v={{ pm_asset_version }}"></script>
<script type="text/babel" src="/static/pm/app.jsx?v={{ pm_asset_version }}"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById("root")).render(<window.PMApp />);
</script>
</body>
</html>
